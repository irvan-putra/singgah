<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>singgah: train, bus, shuttle and flight table</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#66665f;--card:#fff;--line:#dcdcd3;--acc:#0b6b4f;--bad:#a8321f;--warn:#8a5a00}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ececE6;--mut:#a0a09a;--card:#201f1d;--line:#38372f;--acc:#5fd0a5;--bad:#ff8d77;--warn:#e8b64c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:14px;max-width:960px;margin-inline:auto}
h1{font-size:1.4rem;margin:.2rem 0}h2{font-size:1.05rem;margin:1.4rem 0 .5rem}
.mut{color:var(--mut);font-size:.9rem}
.warn{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;margin:.6rem 0;font-size:.9rem}
.ranges{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:.6rem 0;font-size:.95rem;background:var(--card)}
select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.6rem 0}
.chips button{min-height:40px}.chips button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.mode-panel{display:flex;flex-wrap:wrap;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:-.2rem 0 .6rem}
.mode-panel[hidden]{display:none}.mode-panel label{display:flex;align-items:center;gap:5px;font-size:.92rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.8rem;color:var(--mut);cursor:pointer;user-select:none;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:not([data-k]){cursor:default}
th[aria-sort]::after{content:attr(data-arrow)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--mut)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}
.badge.cheapest{background:var(--acc);color:var(--bg)}
.badge.soldout{background:var(--bad);color:var(--bg)}
.badge.unver{border:1px solid var(--warn);color:var(--warn)}
tr.cheapest td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.ok{color:var(--acc)}.no{color:var(--bad)}
@media(max-width:640px){
 table,thead,tbody,tr,td{display:block}
 thead tr{display:flex;flex-wrap:wrap;gap:4px;border:0;background:none;padding:0}
 th{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
 th:not([data-k]){border:0;border-radius:0;padding:8px 0;cursor:default}
 tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 8px}
 td{border:0;padding:2px 0}
 td[data-l]::before{content:attr(data-l) ": ";color:var(--mut);font-size:.8rem}
 td.t{font-weight:600;font-size:1.05rem}
}
a{color:var(--acc)}footer{margin:2rem 0 1rem;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<p><label>Trip <select id="trip"></select></label></p>
<div id="head"></div>
<div class="ranges" id="ranges"></div>


<h2>All transport</h2>
<div class="chips" id="chips"></div>
<div class="mode-panel" id="mode-panel"></div>
<p class="mut" id="state"></p>
<table id="tbl"><thead><tr id="hr"></tr></thead><tbody id="rows"></tbody></table>
<p class="mut" id="count"></p>

<h2>Sources</h2><ul id="src" class="mut"></ul>
<p><a id="book" href="https://booking.kai.id/">Check trains on KAI Access (booking.kai.id)</a></p>

<footer>Built with AI assistance (Instinct and others). Not everything has been reviewed by Irvan. The data was gathered by AI from public pages and has not been checked live. Open source, AGPL-3.0: <a href="https://github.com/irvan-putra/singgah">github.com/irvan-putra/singgah</a>.</footer>
<script>
const $=id=>document.getElementById(id);
const rp=(n,m)=>n==null?"n/a":"Rp"+Math.round(n/1000).toLocaleString("id-ID")+"k"+(m&&m!==n?"-"+Math.round(m/1000).toLocaleString("id-ID")+"k":"");
const dd=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"";
let data,trip,sortKey="price",sortDir=1,filt={dir:"out",modes:["train","bus","shuttle","flight"]},modePanelOpen=true;
const cols=[ ["dep","Departs"],["arr","Arrives"],["price","Price"] ];
const key=(l,k)=>k==="dep"?l.depDate+l.dep:k==="arr"?(l.arrDate?l.arrDate+l.arr:"9"):k==="price"?(l.price??1e12):k==="dir"?l.dir:k==="note"?l.note:l.train;
const evStart=()=>trip.event.date+trip.event.start, evEnd=()=>trip.event.date+trip.event.end;
const BUF={out:{ground:90,flight:150},back:{ground:60,flight:120}};
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const addm=(d,t,m)=>{const x=new Date(d+"T00:00:00");x.setMinutes(mins(t)+m);const p=n=>String(n).padStart(2,"0");return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())+p(x.getHours())+":"+p(x.getMinutes())};
const bufOf=l=>BUF[l.dir][(l.mode||"train")==="flight"?"flight":"ground"];
function verdict(l){
 if(l.soldOut)return["sold out","no"];
 if(l.dir==="out"){if(!l.arrDate)return["arrival unknown","mut"];
  if(l.arrDate<trip.event.date)return["day before","mut"];
  const need=addm(trip.event.date,trip.event.start,-bufOf(l));
  return (l.arrDate+l.arr)<=need?["arrives in time","ok"]:["too late for the start","no"]}
 if(l.depDate>trip.event.date)return["day after","mut"];
 const need=addm(trip.event.date,trip.event.end,bufOf(l));
 return (l.depDate+l.dep)>=need?["leaves after the event","ok"]:["leaves too early","no"]}
function render(){
 $("head").innerHTML=`<div><b>${trip.event.name}</b>, ${dd(trip.event.date)} ${trip.event.start}-${trip.event.end} (WIB)<br><span class="mut">${trip.event.place}</span></div>`;
 $("book").href=trip.book||"#";
 const label={train:"Train",bus:"Bus",shuttle:"Shuttle",flight:"Flight"};
 const legs=trip.legs.filter(l=>verdict(l)[1]!=="no");
 const order=["train","bus","shuttle","flight"];
 const rangeLines=dir=>{
  const modes={};
  legs.filter(l=>l.dir===dir&&l.price!=null).forEach(l=>{const m=l.mode||"train",mx=l.priceMax||l.price;(modes[m]=modes[m]||{lo:1/0,hi:0});modes[m].lo=Math.min(modes[m].lo,l.price);modes[m].hi=Math.max(modes[m].hi,mx)});
  return order.filter(m=>modes[m]).map(m=>`${label[m]}: ${rp(modes[m].lo,modes[m].hi)}`).join("<br>");
 };
 $("ranges").innerHTML=[['Going','out'],['Return','back']].map(([title,dir])=>{const lines=rangeLines(dir);return lines?`<b>${title}</b><br>${lines}`:""}).filter(Boolean).join("<br><br>");
 const byId=Object.fromEntries(trip.legs.map(l=>[l.id,l]));
 const buyFor=l=>{const m=l.mode||"train";const c=trip.combos.find(c=>c.legs.includes(l.id))||trip.combos.find(c=>c.legs.some(i=>(byId[i].mode||"train")===m));if(!c)return"";let bs=c.buy||[];
  if(m==="bus"||m==="shuttle")bs=bs.filter(b=>l.dir==="out"?!/Jogja to Jakarta|^Return/.test(b.label):!/Jakarta to Jogja|^Going/.test(b.label)||/Traveloka/.test(b.label));
  return bs.map(b=>`<a href="${b.url}">${b.label}</a>`).join(" | ")};
 const modes=[...new Set(trip.legs.map(l=>l.mode||"train"))].sort((a,b)=>["train","bus","shuttle","flight"].indexOf(a)-["train","bus","shuttle","flight"].indexOf(b));
 const modeName={train:"Train",bus:"Bus",shuttle:"Shuttle",flight:"Flight"};
 const chips=[["dir","out","Going"],["dir","back","Return"],["mode","toggle",`Transport${filt.modes.length<modes.length?` (${filt.modes.length})`:""}`]];
 $("chips").innerHTML=chips.map(([k,v,t])=>`<button aria-pressed="${k==="mode"?modePanelOpen:filt.dir===v}" data-k="${k}" data-v="${v}">${t}</button>`).join("");
 $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.k==="dir")filt.dir=b.dataset.v;else modePanelOpen=!modePanelOpen;render()});
 const panel=$("mode-panel");panel.hidden=!modePanelOpen;
 panel.innerHTML=modes.map(m=>`<label><input type="checkbox" data-mode="${m}" ${filt.modes.includes(m)?"checked":""}> ${modeName[m]||m}</label>`).join("");
 panel.querySelectorAll("input").forEach(c=>c.onchange=()=>{filt.modes=c.checked?[...filt.modes,c.dataset.mode]:filt.modes.filter(m=>m!==c.dataset.mode);render()});
 const sortText={train:["name A to Z","name Z to A"],dep:["earliest departure first","latest departure first"],arr:["earliest arrival first","latest arrival first"],price:["cheapest first","most expensive first"],note:["note A to Z","note Z to A"]};
 const filterText=(filt.dir==="out"?"Going options only":"Return options only")+` · ${filt.modes.length===modes.length?"all transport":filt.modes.length===0?"no transport modes selected":filt.modes.map(m=>modeName[m]||m).join(", ")+" only"}`;
 $("state").textContent=filterText+" · "+sortText[sortKey][sortDir>0?0:1]+" (tap a heading again to flip)";
 $("hr").innerHTML=cols.map(([k,t])=>`<th ${k?`data-k="${k}" ${k===sortKey?`aria-sort="${sortDir>0?"ascending":"descending"}" data-arrow="${sortDir>0?" ▲":" ▼"}"`:""}`:""}>${t}</th>`).join("");
 $("hr").querySelectorAll("th[data-k]").forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()});
 const cheap={};
 ["out","back"].forEach(dir=>{
  const vs=legs.filter(l=>l.dir===dir&&l.price!=null&&!l.soldOut&&l.verified);
  const tr=vs.filter(l=>(l.mode||"train")==="train");
  if(vs.length)cheap[dir+"-any"]=vs.reduce((a,b)=>a.price<b.price?a:b).id;
  if(tr.length)cheap[dir+"-train"]=tr.reduce((a,b)=>a.price<b.price?a:b).id;
 });
 let ls=legs.filter(l=>l.dir===filt.dir&&filt.modes.includes(l.mode||"train"));
 ls.sort((a,b)=>{const x=key(a,sortKey),y=key(b,sortKey);return (x>y?1:x<y?-1:0)*sortDir});
 $("rows").innerHTML=ls.map(l=>{const[v,c]=verdict(l);
  const isC=l.id===cheap[l.dir+"-any"],isCT=l.id===cheap[l.dir+"-train"]&&!isC;
  const pb=(l.soldOut?'<span class="badge soldout">sold out</span>':"")+(isC?'<span class="badge cheapest">cheapest</span>':"")+(isCT?'<span class="badge cheapest">cheapest train</span>':"")+(l.verified===false?'<span class="badge unver">unverified</span>':"");
  return `<tr class="${isC||isCT?"cheapest":""}">
 <td class="t" data-l="Transport">${l.train} <span class="tag">${l.dir==="out"?"Going":"Return"}</span> <span class="tag">${l.mode&&l.mode!=="train"?l.mode+", ":""}${l.class}</span></td>
 <td data-l="Departs">${dd(l.depDate)} ${l.dep}</td>
 <td data-l="Arrives">${l.arrDate?dd(l.arrDate)+" "+l.arr:"not found"}</td>
 <td data-l="Price">${rp(l.price,l.priceMax)}${pb} <span class="mut">(${l.priceNote})</span></td>
 <td data-l="Note"><span class="${c}">${v}.</span> ${l.note}</td>
 <td data-l="Buy">${buyFor(l)}</td></tr>`}).join("");
 $("count").textContent=ls.length+" of "+legs.length+" options that fit the event ("+(trip.legs.length-legs.length)+" hidden: sold out, arrive too late or leave too early). Buffers: arrive at least 90 min (airport 150) before start, leave at least 60 min (airport 120) after the end. Tap a column heading to sort.";
 $("src").innerHTML=trip.sources.map(s=>`<li><a href="${s.url}">${s.label}</a></li>`).join("")+"<li>Progo 300 fare: a 4 Nov fare listing, also in the CNN list above.</li>";
}
fetch("data/trips.json").then(r=>r.json()).then(d=>{
 data=d;const sel=$("trip");sel.innerHTML=d.trips.map(t=>`<option value="${t.id}">${t.title}</option>`).join("");
 const want=new URLSearchParams(location.search).get("trip");if(want)sel.value=want;
 const go=()=>{trip=data.trips.find(t=>t.id===sel.value)||data.trips[0];render()};sel.onchange=go;go();
}).catch(e=>{document.body.insertAdjacentText("afterbegin","Could not load data/trips.json: "+e)});
</script>
</body>
</html>
